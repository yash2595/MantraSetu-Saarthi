apiVersion: apps/v1
kind: Deployment
metadata:
  name: mantrasetu-agentos-backend
  namespace: mantrasetu-production
  labels:
    app.kubernetes.io/name: mantrasetu-agentos-backend
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: mantrasetu-agentos
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mantrasetu-agentos-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mantrasetu-agentos-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: backend-api
          image: mantrasetu/agentos-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: mantrasetu-config
            - secretRef:
                name: mantrasetu-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
